# Test settings. Every key can be overridden on the command line, e.g. -Dbrowser=edge -Dheadless=true

# Application under test (OrangeHRM open source demo)
baseUrl=https://opensource-demo.orangehrmlive.com
# Practice site for the interview examples OrangeHRM cannot show (alerts, frames, <select>, cookies, ...)
practiceUrl=https://the-internet.herokuapp.com
# chrome, firefox or edge (Selenium Manager downloads the driver)
browser=chrome
# true runs the browser without a window
headless=false
# Explicit wait timeout for every page action
timeoutSeconds=15

# Demo administrator shown on the login page
username=Admin
password=admin123
